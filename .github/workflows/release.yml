name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - "**.cs"
      - "**.xaml"
      - "ToggleScreensaver.csproj"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained executable
        run: >
          dotnet publish ToggleScreensaver.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-artifact

      - name: Update "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Dernier exécutable généré automatiquement depuis la branche main.
          prerelease: false
          make_latest: true
          files: publish-artifact/ToggleScreensaver.exe

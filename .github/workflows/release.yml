name: Build and release installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Résout la version depuis le tag
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="0.0.0-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Installe l'outil de packaging Velopack (vpk)
        run: dotnet tool install -g vpk --version 1.2.158

      - name: Publie l'appli (self-contained, win-x64)
        # Pas de PublishSingleFile : Velopack a besoin des fichiers individuels (exe + dll)
        # pour calculer les deltas entre versions.
        run: >
          dotnet publish ToggleScreensaver.csproj
          -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Récupère les releases précédentes (pour générer des deltas)
        # Échoue légitimement avant la toute première release.
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ github.token }} -o dist

      - name: Empaquette avec Velopack (installeur + paquets de mise à jour)
        run: >
          vpk pack --packId ToggleScreensaver --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe ToggleScreensaver.exe
          --packTitle "Toggle Screensaver" --packAuthors Maf38
          --icon sleep.ico --runtime win-x64 -o dist

      - name: Publie la release GitHub (installeur + assets de mise à jour automatique)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --outputDir dist --token $env:GH_TOKEN --tag ${{ github.ref_name }} --publish true
          $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="${{ github.ref_name }}" --jq .body
          gh release edit "${{ github.ref_name }}" --title "Toggle Screensaver ${{ steps.version.outputs.version }}" --notes "$notes"

      - name: Dépose les paquets comme artefact du run (hors tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*
